<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            background-image: url("{{ url_for('static', filename='images/background.jpg') }}");
            background-size: cover;
            background-position: center;
            font-family: Arial, sans-serif;
            color: white;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: rgba(0, 0, 0, 0.6);
            padding: 30px;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
        }

        .form-group {
            text-align: left;
            margin: 10px 0;
            width: 100%;
        }

        label {
            display: block;
            font-size: 16px;
            color: #fff;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 5px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-sizing: border-box;
        }

        button:hover {
            background-color: #45a049;
        }

        p {
            margin-top: 10px;
        }

        a {
            color: #fff;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Flash messages */
        .flashes {
            list-style-type: none;
            padding: 0;
        }
        .flashes li.success {
            background-color: #4CAF50;
            padding: 10px;
            color: white;
            margin-bottom: 10px;
        }
        .flashes li.danger {
            background-color: #f44336;
            padding: 10px;
            color: white;
            margin-bottom: 10px;
        }

        /* Buttons for Facebook and Google */
        .social-buttons {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .social-buttons button {
            width: 48%;
            padding: 12px;
            background-color: #3b5998; /* Facebook Blue */
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .social-buttons button.google {
            background-color: #db4437; /* Google Red */
        }

        .or-divider {
            margin: 20px 0;
            display: flex;
            align-items: center;
        }

        .or-divider::before,
        .or-divider::after {
            content: "";
            flex: 1;
            border-bottom: 1px solid #ccc;
        }

        .or-divider span {
            padding: 0 10px;
            color: #fff;
        }

    </style>
</head>
<body>
    <div class="container">
        <h2>Welcome, Please sign in to continue</h2>

        <!-- Flash messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <ul class="flashes">
              {% for category, message in messages %}
                <li class="{{ category }}">{{ message }}</li>
              {% endfor %}
            </ul>
          {% endif %}
        {% endwith %}

        <!-- Social Sign In Buttons -->
        <div class="social-buttons">
            <button>Sign in with Facebook</button>
            <button class="google">Sign in with Google</button>
        </div>

        <!-- OR Divider -->
        <div class="or-divider">
            <span>OR</span>
        </div>

        <!-- Login Form -->
        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" name="email" id="email" placeholder="Enter your email" required><br>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" placeholder="Enter your password" required><br>
            </div>

            <button type="submit">Login</button>
        </form>
        <p><a href="{{ url_for('register') }}">Don't have an account? Register here.</a></p>
    </div>
</body>
</html>
